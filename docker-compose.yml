services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hr_dev
      POSTGRES_PASSWORD: ${HR_POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: hr_workspace
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres_hr_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_dev -d hr_workspace"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_hr_data:
